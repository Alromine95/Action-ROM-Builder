version: 2.1

jobs:
  build-rom:
    machine:
      image: ubuntu-2204:current
    resource_class: large   # use the biggest class your plan allows
    steps:
      - run:
          name: Check disk space
          command: df -h
      - run:
          name: Set git identity
          command: |
            git config --global user.name "Alromine95"
            git config --global user.email "you@example.com"
      - run:
          name: Run build script
          no_output_timeout: 120m
          command: |
            mkdir -p ~/rom && cd ~/rom
            curl -fsSL https://raw.githubusercontent.com/Alromine95/vol/refs/heads/main/yaap.sh -o build.sh
            chmod +x build.sh
            ./build.sh
      - store_artifacts:
          path: ~/rom/out/target/product/blossom
          destination: rom

workflows:
  build:
    jobs:
      - build-rom

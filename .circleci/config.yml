version: 2.1

jobs:
  build-rom:
    machine:
      image: ubuntu-2204:current
    resource_class: large   # use the biggest class your plan allows
    steps:
      - run:
          name: Free disk space and check what is left
          command: |
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet 2>/dev/null || true
            df -h
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
              zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 repo ccache
      - run:
          name: Set git identity
          command: |
            git config --global user.name "Alromine95"
            git config --global user.email "you@example.com"
      - run:
          name: Run build script
          no_output_timeout: 120m
          command: |
            mkdir -p ~/rom && cd ~/rom
            curl -fsSL https://raw.githubusercontent.com/Alromine95/vol/refs/heads/main/build_yaap_blossom.sh -o build.sh
            chmod +x build.sh
            ./build.sh
      - store_artifacts:
          path: ~/rom/out/target/product/blossom
          destination: rom

workflows:
  build:
    jobs:
      - build-rom
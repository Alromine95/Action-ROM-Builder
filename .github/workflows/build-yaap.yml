name: Build LineageOS ROM

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://github.com/yaap/manifest.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'sixteen'
      MANIFEST_TREE_URL:
        description: 'MANIFEST_TREE_URL'
        required: true
        default: 'https://github.com/Alromine95/Local-manifest.git'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      REPO_MANIFEST:
        description: 'MANIFEST_PATH'
        required: true
        default: '.repo/local_manifests'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'blossom'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (product-release-variant)'
        required: true
        default: 'yaap_blossom-bp2a-userdebug'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'm yaap'

jobs:
  build-lineageos:
    # NOTE: ubuntu-latest tops out around 14GB disk / 2 cores — nowhere near
    # enough for a full AOSP+YAAP source tree (250-400GB+). This workflow
    # WILL fail on disk space during repo sync unless "runs-on" below is
    # pointed at a self-hosted runner with real disk/CPU (e.g. your own VM
    # registered as a GitHub Actions runner). Swap the line below once you
    # have one:
    #   runs-on: self-hosted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check if sender is repository owner
      if: github.event.repository.owner.login == github.event.sender.login
      run: |
        echo "Sender is the repository owner"
    - name: Not the repository owner
      if: github.event.repository.owner.login != github.event.sender.login
      run: |
        echo "Sender is not the repository owner"
        exit 1

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt install git aria2 -y
        export JAVA_HOME=$(readlink -f $(which java))
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
        mkdir ${{ steps.pwd.outputs.workspace-folder }}/ccache
        export USE_CCACHE=1
        export CCACHE_DIR=${{ steps.pwd.outputs.workspace-folder }}/ccache/
        ccache -M 50G
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo init
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        mkdir lineage
        cd lineage
        repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1 --git-lfs --groups=default,-mips,-x86,-darwin
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # FIX: local manifest (device/vendor/kernel trees) must be cloned
    # BEFORE the main repo sync runs — otherwise repo sync only pulls the
    # generic YAAP base tree, with no device-specific repos at all, since
    # they weren't declared in the manifest set yet at sync time.
    - name: Clone local manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.MANIFEST_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.REPO_MANIFEST }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # FIX: the actual repo sync now runs AFTER the local manifest (and
    # optional common tree) are in place, so the device/vendor/kernel
    # projects declared in them actually get pulled down.
    - name: Repo sync
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build YAAP ROM
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        . build/envsetup.sh
        export USE_CCACHE=1
        export CCACHE_DIR=ccache/
        ccache -M 50G
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}
        ${{ github.event.inputs.BUILD_TARGET }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

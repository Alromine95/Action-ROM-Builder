name: Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://github.com/yaap/manifest.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'seventeen' # Changed default to seventeen for Android 16.2
      MANIFEST_TREE_URL:
        description: 'MANIFEST_TREE_URL'
        required: true
        default: 'https://github.com/Alromine95/Local-manifest.git'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      REPO_MANIFEST:
        description: 'MANIFEST_PATH'
        required: true
        default: '.repo/local_manifests'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'blossom'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (product-release-variant)'
        required: true
        default: 'yaap_blossom-bp2a-eng' # Default set directly to eng target
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'm yaap'

jobs:
  build-yaapos:
    runs-on: ubuntu-latest # Points to your 16GB RAM / 130GB Storage runner configuration
    permissions:
      contents: write
    steps:
    - name: Check if sender is repository owner
      if: github.event.repository.owner.login == github.event.sender.login
      run: |
        echo "Sender is the repository owner"
    - name: Not the repository owner
      if: github.event.repository.owner.login != github.event.sender.login
      run: |
        echo "Sender is not the repository owner"
        exit 1

    - name: Cleanup Host Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update
        sudo apt install git aria2 git-lfs -y
        export JAVA_HOME=$(readlink -f $(which java))
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo init (Hollow / Partial Clone Setup)
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        mkdir lineage
        cd lineage
        # Swapped to modern partial cloning configuration to bypass 130GB space ceiling
        repo init -u ${{ github.event.inputs.SYNC_URL }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }} \
          --depth=1 \
          --git-lfs \
          --partial-clone \
          --clone-filter=blob:limit=10M \
          --groups=default,-mips,-x86,-darwin,-notdefault,-device
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone local manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.MANIFEST_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.REPO_MANIFEST }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null && github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != null && github.event.inputs.COMMON_PATH != ''
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo sync
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Create Hyper-Optimized SSD Swap Space (zRAM Fix)
      run: |
        # Fixed Azure Module missing bug by rolling custom 16GB hard drive swap ceiling
        sudo swapoff -a || true
        sudo fallocate -l 16G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=100
        sudo sysctl vm.vfs_cache_pressure=50
        free -h

    - name: Configure git identity
      run: |
        git config --global user.email "abhinav@gmail.com"
        git config --global user.name "Abhinav singh"

    - name: Fix Audio Android.bp select type condition
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        AUDIO_BP="hardware/interfaces/audio/common/all-versions/default/Android.bp"
        if [ -f "$AUDIO_BP" ]; then
            echo "🔧 Fixing Audio select type condition..."
            sed -i 's/"true":/true:/g' "$AUDIO_BP"
            echo "✅ Audio Android.bp patched!"
        else
            echo "⚠️ Audio Android.bp not found, skipping patch."
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Compile YAAP ROM (Ultra RAM & Storage Friendly)
      run: |
        # FIX: Changed target from 'cd yaap' to 'cd lineage' to correctly track your initialized directory
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        source build/envsetup.sh
        
        # =================================================================
        # 💾 STORAGE-SAVING CONTROLS
        # =================================================================
        export USE_CCACHE=0
        export WITH_DEXPREOPT=false
        export WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=false
        export DISABLE_PROGUARD=true
        export WITHOUT_CHECK_API=true
        export ZSTD_CLEVEL=19
        export LZ4_CLEVEL=9
        export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true

        # =================================================================
        # 🧠 RAM-SAVING CONTROLS
        # =================================================================
        export NINJA_ARGS="-j4"
        export LDFLAGS="-Wl,--threads=1"
        export RBE_num_local_workers=1
        export METALAVA_MAX_HEAP_SIZE=2g
        export _JAVA_OPTIONS="-Xmx4g -XX:MaxMetaspaceSize=512m"
        
        # Dynamically references 'yaap_blossom-bp2a-eng' from workflow input parameters
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}
        
        ${{ github.event.inputs.BUILD_TARGET }} $NINJA_ARGS
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/ || true
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ || true

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
